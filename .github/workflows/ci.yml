name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust Core (fmt, clippy, tests)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Format Check
        run: cd core && cargo fmt --check

      - name: Clippy Linter
        run: cd core && cargo clippy --all-targets -- -D warnings

      - name: Run Core Tests
        run: cd core && cargo test

      - name: Performance Release Benchmark
        run: cd core && cargo test --release --test performance

  macos-app:
    name: macOS App (Swift + MarkDevKit)
    runs-on: macos-26
    needs: rust-checks
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Xcode Toolchain
        run: |
          version=$(xcodebuild -version | awk 'NR==1 {print $2}')
          case "$version" in
            26.*)
              echo "Using Xcode $version"
              ;;
            *)
              echo "::error::Xcode 26.x is required (MACOSX_DEPLOYMENT_TARGET=26.0); runner has '$version'"
              exit 1
              ;;
          esac

      - name: Install Tools
        run: brew install just xcodegen

      - name: Build Rust Core
        run: just build-core-debug

      - name: Generate Xcode Project
        run: just generate

      - name: Build and Test AppKit Targets
        run: just test-app
