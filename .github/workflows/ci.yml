name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust Core and Release Contracts (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: core
      - name: Install Tools
        run: bash tools/ci/install-pinned-tools.sh just
      - name: Rust, performance, and release checks
        run: just ci-core

  # The app needs Xcode 27.0 (27A266a), which `just verify-toolchain` pins and
  # the macos-26 images do not carry. `xcode-27` does, as its default, and is
  # arm64 only — no hosted Intel image has Xcode 27 — so the x86_64 slice is
  # proven by the universal Release build linking, not by running tests.
  macos-app:
    name: macOS App (Debug Tests + Universal Release, xcode-27)
    runs-on: xcode-27
    needs: rust-checks
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install pinned tools
        run: bash tools/ci/install-pinned-tools.sh all
      - name: Select pinned Xcode
        run: bash tools/ci/select-pinned-xcode.sh
      - name: Verify Xcode Toolchain
        run: just verify-toolchain
      - name: Build and Test AppKit Targets
        run: just test-app
      - name: Build Universal Release
        run: just build-release
