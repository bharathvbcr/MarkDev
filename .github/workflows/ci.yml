name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-checks:
    name: Rust Core and Release Contracts
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install Tools
        run: brew install just
      - name: Rust, performance, and release checks
        run: just ci-core

  macos-app:
    name: macOS App (Swift + MarkDevKit)
    runs-on: macos-26
    needs: rust-checks
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tools
        run: brew install just xcodegen
      - name: Verify Xcode Toolchain
        run: just verify-toolchain
      - name: Build and Test AppKit Targets
        run: just test-app
