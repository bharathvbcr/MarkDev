name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag, commit, and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/release/release.py preflight "$TAG"

  checks:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  stage:
    name: Build, verify, and stage the release
    needs: checks
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.98.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install pinned tools
        run: bash tools/ci/install-pinned-tools.sh release
      - name: Verify Release Toolchain
        run: just verify-release-toolchain
      - name: Build Release
        run: just build-release
      - name: Stage Artifact
        env:
          TAG: ${{ github.ref_name }}
        run: just release-stage "$TAG"
      - name: Attach and verify draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: just release-draft "$TAG"
