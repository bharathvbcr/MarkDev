name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Validate tag, commit, and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: python3 tools/release/release.py preflight "$TAG"

  checks:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  stage:
    name: Build, verify, and stage the release
    needs: checks
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tools
        run: brew install just xcodegen
      - name: Verify Xcode Toolchain
        run: just verify-toolchain
      - name: Build Release
        run: just build-release
      - name: Stage Artifact
        env:
          TAG: ${{ github.ref_name }}
        run: just release-stage "$TAG"
      - name: Attach and verify draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: just release-draft "$TAG"
