[package]
name = "markdev-highlight"
version.workspace = true
edition.workspace = true
description = "Tree-sitter syntax highlighting for MarkDev's fenced code blocks"
license.workspace = true

[dependencies]
serde.workspace = true
# Real grammars rather than a hand-rolled tokenizer: they get raw strings,
# nested templates, and regex literals right, which a regex-based highlighter
# never quite does.
tree-sitter = "0.26"
tree-sitter-highlight = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-swift = "0.7"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
