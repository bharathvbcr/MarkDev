language = "C"
header = "// Generated by cbindgen from core/src/ffi.rs — do not edit by hand."
include_guard = "MARKDEV_H"
pragma_once = true
autogen_warning = "// Regenerate with `just header`."
documentation = true
documentation_style = "c99"
cpp_compat = true

[export]
prefix = "MD"
include = ["StyleSpan", "SyntaxMarker", "BlockDescriptor"]

[parse]
# The FFI structs and every module's limits now live in the module crates.
# `include` makes cbindgen parse them; `extra_bindings` makes it emit their
# top-level items (the `#define` limits Swift reads), which it otherwise does
# only for the binding crate itself.
parse_deps = true
include = ["markdev-md", "markdev-highlight", "markdev-html", "markdev-vault"]
extra_bindings = ["markdev-md", "markdev-highlight", "markdev-html", "markdev-vault"]

[enum]
prefix_with_name = true
