[workspace]
# The core is split into crates so an embedder takes only the modules it uses:
# GitPulse links the parser, renderer, highlighter and vault, never the C ABI.
# This package (`markdev`) stays the workspace root and the one MarkDev.app
# links — it re-exports every module under its old path and owns the FFI, so
# `libmarkdev.a`, `include/markdev.h` and `core/target/` do not move.
members = [
    ".",
    "crates/markdev-md",
    "crates/markdev-highlight",
    "crates/markdev-html",
    "crates/markdev-vault",
]
# Every member, so a bare `cargo test` / `cargo clippy` in core/ — what the
# justfile and CI run — still covers the module crates' own unit tests. With a
# root package and no default-members, cargo would select only the root and
# those tests would silently stop running.
default-members = [
    ".",
    "crates/markdev-md",
    "crates/markdev-highlight",
    "crates/markdev-html",
    "crates/markdev-vault",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["html", "simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "markdev"
version.workspace = true
edition.workspace = true
description = "Native Markdown core for MarkDev — parsing, indexing, and search"
license.workspace = true

[lib]
name = "markdev"
crate-type = ["staticlib", "lib"]

[features]
default = ["ffi", "highlight", "mathml"]
# Gates the C ABI and the cbindgen header build. Embedders link the module
# crates directly and never need either.
ffi = ["dep:cbindgen"]
# Gates tree-sitter highlighting, which lives in `markdev-highlight`.
highlight = ["dep:markdev-highlight"]
# Typesets `$…$` / `$$…$$` as MathML in HTML export, so browsers draw real
# math without script. Forwarded to `markdev-html`.
mathml = ["markdev-html/mathml"]

[dependencies]
# Sibling crates by path, as each member names its own, so a crate copied out
# of this workspace (GitPulse vendors them) still finds its neighbours.
markdev-md = { path = "crates/markdev-md" }
markdev-highlight = { path = "crates/markdev-highlight", optional = true }
markdev-html = { path = "crates/markdev-html", default-features = false }
markdev-vault = { path = "crates/markdev-vault" }
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
cbindgen = { version = "0.29", optional = true }

[dev-dependencies]
proptest = "1"
pulldown-cmark.workspace = true

# These integration targets exercise optional APIs. Keep the default suite
# intact while allowing parser-only and highlight-only embedding builds.
[[test]]
name = "highlight"
required-features = ["highlight"]

[[test]]
name = "highlight_limits"
required-features = ["ffi", "highlight"]

[[test]]
name = "html_export"
required-features = ["ffi"]

[[test]]
name = "parser_limits"
required-features = ["ffi"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
